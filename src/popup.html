<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XCPO · 评论过滤</title>
  <style>
    :root { --bg:#0f1419; --card:#161d26; --border:#2f3336; --txt:#e7e9ea; --muted:#8b98a5; --blue:#1d9bf0; --red:#dc2626; --green:#22c55e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 340px; background: var(--bg); color: var(--txt); font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .wrap { padding: 14px; }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    header .logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg,#1d9bf0,#0f1419); display:flex; align-items:center; justify-content:center; font-size: 16px; }
    header h1 { font-size: 15px; font-weight: 700; }
    header .ver { color: var(--muted); font-size: 11px; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
    .toggle-row .lbl b { font-size: 13px; }
    .toggle-row .lbl small { display:block; color: var(--muted); margin-top: 2px; }
    .switch { position: relative; width: 40px; height: 22px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #3a444c; border-radius: 22px; cursor: pointer; transition: .2s; }
    .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background: var(--blue); }
    input:checked + .slider::before { transform: translateX(18px); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    .stat .n { font-size: 20px; font-weight: 800; }
    .stat .n.red { color: var(--red); }
    .stat .n.green { color: var(--green); }
    .stat .t { color: var(--muted); font-size: 11px; }
    .mode-row { display: flex; gap: 6px; margin-bottom: 10px; }
    .mode-row button { flex: 1; padding: 7px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--txt); cursor: pointer; font-size: 12px; }
    .mode-row button.on { border-color: var(--blue); color: var(--blue); font-weight: 600; }
    .recent { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; max-height: 210px; overflow-y: auto; }
    .recent h3 { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .item { display: flex; align-items: flex-start; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--border); }
    .item:last-child { border-bottom: none; }
    .item .txt { flex: 1; font-size: 12px; word-break: break-all; }
    .item .txt small { display: block; color: var(--muted); margin-top: 2px; }
    .item button { flex: none; border: none; background: transparent; color: var(--blue); cursor: pointer; font-size: 12px; padding: 2px 4px; }
    .empty { color: var(--muted); text-align: center; padding: 14px 0; font-size: 12px; }
    footer { display: flex; justify-content: space-between; margin-top: 10px; }
    footer a, footer button { color: var(--muted); background: none; border: none; cursor: pointer; font-size: 12px; text-decoration: none; }
    footer button:hover, footer a:hover { color: var(--txt); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">🛡</div>
      <div>
        <h1>X 评论城管 <span class="ver">v1.0.0</span></h1>
      </div>
    </header>

    <div class="toggle-row">
      <div class="lbl">
        <b>启用过滤</b>
        <small>隐藏评论区招嫖广告 / 钓鱼评论</small>
      </div>
      <label class="switch"><input type="checkbox" id="enabled" /><span class="slider"></span></label>
    </div>

    <div class="stats">
      <div class="stat"><div class="n red" id="count">0</div><div class="t">本页已过滤</div></div>
      <div class="stat"><div class="n green" id="total">0</div><div class="t">本会话累计</div></div>
    </div>

    <div class="mode-row">
      <button data-mode="hide" id="modeHide">🚫 彻底隐藏</button>
      <button data-mode="dim" id="modeDim">👁 审查模式(半透明)</button>
    </div>

    <div class="recent">
      <h3>最近过滤的评论（误杀可点恢复）</h3>
      <div id="list"><div class="empty">还没有过滤记录</div></div>
    </div>

    <footer>
      <button id="openOptions">⚙ 设置</button>
      <span id="pageHint" style="color:var(--muted)"></span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
